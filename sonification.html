<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151d">
    <title>Detector sonification</title>
    <link rel="stylesheet" href="sonification.css">
    <script type="module" src="sonification.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Detector sonification</h1>
      </header>
      <section class="sonification" aria-label="10-minute detector sonification">
        <canvas
          id="detector"
          role="group"
          tabindex="0"
          aria-label="Interactive photon grid. Click a quadrant to toggle its tone. Use arrow keys to select a quadrant, then Enter or Space to toggle it."
        ></canvas>
        <div class="transport" aria-label="Audio playback">
          <button id="play" type="button" disabled>Play</button>
          <button id="stop" type="button" disabled>Stop</button>
        </div>
        <p id="status" role="status" aria-live="polite">Loading 10-minute dataset…</p>
        <p id="error" role="alert" hidden></p>
      </section>
    </main>
  </body>
</html>
