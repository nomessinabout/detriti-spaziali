<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151d">
    <title>Detector data explorer</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Detector data explorer</h1>
      </header>
      <section class="visualizer" aria-label="Detector data visualizer">
        <div class="controls">
          <label class="dataset-control">
            Dataset
            <select id="dataset"></select>
          </label>
          <div class="transport" aria-label="Playback controls">
            <button id="play" type="button" disabled>Play</button>
            <button id="stop" type="button" disabled>Stop</button>
          </div>
          <button id="pattern-overlay" class="overlay-toggle" type="button" aria-pressed="false" disabled>
            Show pattern controls
          </button>
        </div>
        <div class="detector-wrap">
          <canvas id="detector" aria-label="16 by 16 detector heatmap"></canvas>
          <div id="detector-tooltip" class="detector-tooltip" role="status" hidden></div>
        </div>
        <label class="frame-slider">
          <span id="frame-label">Frame 1</span>
          <input id="frame-slider" type="range" min="0" max="0" value="0" disabled>
        </label>
        <p id="status" role="status" aria-live="polite">Loading datasets…</p>
        <p id="audio-status" role="status" aria-live="polite">Audio will start with playback.</p>
        <p id="error" role="alert" hidden></p>
      </section>
    </main>
  </body>
</html>
